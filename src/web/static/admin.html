<!DOCTYPE html>
<html lang="zh-CN" data-theme="dim">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>音河 · 后台管理</title>
    <meta name="theme-color" content="#15181d">
    <link rel="stylesheet" href="node_modules/@phosphor-icons/web/src/regular/style.css">
    <link rel="stylesheet" href="node_modules/@phosphor-icons/web/src/fill/style.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-page-body { overflow: auto; background: var(--bg); }
        .admin-page { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; }
        .admin-page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
        .admin-page-brand { display: flex; align-items: center; gap: 10px; }
        .admin-page-brand .logo { width: 34px; height: 34px; font-size: 19px; }
        .admin-page-brand h1 { margin: 0; font-size: 17px; }
        .admin-page-brand p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
        .flex { display: flex; }
        .flex-1 { flex: 1; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 8px; }
        .btn-xxs { padding: 3px 7px; font-size: 10px; }
    </style>
</head>
<body class="admin-page-body">
    <div class="admin-page">
        <div class="admin-page-head">
            <div class="admin-page-brand">
                <span class="logo">♪</span>
                <div>
                    <h1>音河 · 后台管理</h1>
                    <p>用户、内容与运行数据管控中心</p>
                </div>
            </div>
        </div>
        <div id="adminView"></div>
    </div>
    <div id="toast" class="toast-box hidden"><div></div></div>
    <script type="module" src="js/admin-main.js"></script>
</body>
</html>
