[project]
name = "yinhe"
version = "0.2.0"
description = "音河——多音源音乐搜索、试听与下载的 Web 服务 + H5 前端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.136.3",
    "lxml>=6.1.1",
    "platformdirs>=4.10.0",
    "pycryptodome>=3.23.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.0",
    "requests>=2.34.2",
    "curl-cffi>=0.17.0",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
    "yt-dlp>=2026.6.9",
]

[project.scripts]
music-web = "yinhe.web.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yinhe"]

[dependency-groups]
dev = []
